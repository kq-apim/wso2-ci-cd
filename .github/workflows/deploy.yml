name: WSO2 API CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "WSO2 environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - uat
          - prod

jobs:

  # ============================================================
  # CI - VALIDATE API
  # ============================================================

  validate:
    name: Validate API
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check API project structure
        run: |
          echo "Checking WSO2 API project..."

          if [ ! -f "api.yaml" ]; then
            echo "ERROR: api.yaml not found"
            exit 1
          fi

          if [ ! -f "api_meta.yaml" ]; then
            echo "ERROR: api_meta.yaml not found"
            exit 1
          fi

          if [ ! -f "Definitions/swagger.yaml" ]; then
            echo "ERROR: Definitions/swagger.yaml not found"
            exit 1
          fi

          echo "WSO2 API project structure is valid."

      - name: Validate OpenAPI specification
        run: |
          echo "Validating OpenAPI specification..."

          npx @redocly/cli lint Definitions/swagger.yaml


  # ============================================================
  # CD - DEPLOY API
  # ============================================================

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest

    needs: validate

    # The GitHub Environment determines which
    # URL and credentials are supplied.
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # Install WSO2 apictl
      # ========================================================

      - name: Download and extract apictl
        run: |
          echo "Downloading WSO2 apictl..."

          mkdir -p /tmp/apictl

          curl -L \
            -o /tmp/apictl.tar.gz \
            https://github.com/wso2/product-apim-tooling/releases/download/v4.7.2/apictl-4.7.2-linux-amd64.tar.gz

          tar -xzf /tmp/apictl.tar.gz -C /tmp/apictl

          echo "apictl downloaded successfully."


      - name: Add apictl to PATH
        run: |
          echo "/tmp/apictl/apictl" >> $GITHUB_PATH


      - name: Check apictl version
        run: |
          apictl version


      # ========================================================
      # Configure target WSO2 environment
      # ========================================================

      - name: Configure WSO2 environment
        run: |
          echo "Configuring WSO2 API Manager environment..."

          apictl add env target \
            --apim "${{ secrets.WSO2_APIM_URL }}"


      # ========================================================
      # Login to WSO2 API Manager
      # ========================================================

      - name: Login to WSO2 API Manager
        run: |
          echo "Logging in to WSO2 API Manager..."

          apictl login target \
            -u "${{ secrets.WSO2_USERNAME }}" \
            -p "${{ secrets.WSO2_PASSWORD }}" \
            -k


      # ========================================================
      # Deploy WSO2 API
      # ========================================================

      - name: Deploy API
        run: |
          echo "Deploying WSO2 API..."

          apictl import api \
            -f . \
            -e target \
            -k \
            --update \
            --verbose

          echo "API deployment completed successfully."
