name: WSO2 API CI/CD

on:
  # ============================================================
  # AUTOMATIC DEPLOYMENT
  # ============================================================
  # Push to dev starts the normal CI/CD pipeline.
  #
  # Flow:
  # Push to dev
  #     ↓
  # Validate
  #     ↓
  # Deploy DEV
  #     ↓
  # PROD approval
  #     ↓
  # Deploy PROD
  # ============================================================

  push:
    branches:
      - dev

  # ============================================================
  # MANUAL DEPLOYMENT / ROLLBACK
  # ============================================================
  #
  # From GitHub Actions -> Run workflow you can select:
  #
  #   Deploy
  #   Rollback
  #
  # For Rollback, provide the Git commit SHA or tag that
  # represents the version to restore.
  #
  # ============================================================

  workflow_dispatch:
    inputs:

      deployment_type:
        description: 'Select deployment type'
        required: true
        type: choice
        options:
          - Deploy
          - Rollback
        default: Deploy

      rollback_ref:
        description: 'Git commit SHA or tag to restore (required for Rollback)'
        required: false
        type: string


jobs:

  # ============================================================
  # 1. VALIDATE
  # ============================================================

  validate:
    name: Validate API
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_type == 'Rollback' && inputs.rollback_ref || github.ref }}


      # ----------------------------------------------------------
      # Show deployment information
      # ----------------------------------------------------------

      - name: Show deployment information
        run: |
          echo "=========================================="
          echo "Deployment type:"
          echo "${{ inputs.deployment_type || 'Deploy' }}"
          echo "=========================================="
          
          if [ "${{ inputs.deployment_type }}" = "Rollback" ]; then
            echo "Rollback version:"
            echo "${{ inputs.rollback_ref }}"
          else
            echo "Deploying current source version."
          fi
      

      # ----------------------------------------------------------
      # Validate rollback input
      # ----------------------------------------------------------

      - name: Validate rollback input
        if: ${{ inputs.deployment_type == 'Rollback' }}
        run: |
          echo "Checking rollback configuration..."
          
          if [ -z "${{ inputs.rollback_ref }}" ]; then
            echo "ERROR: A Git commit SHA or tag is required for rollback."
            exit 1
          fi
          
          echo "Rollback target: ${{ inputs.rollback_ref }}"
      

      # ----------------------------------------------------------
      # Check WSO2 API project structure
      # ----------------------------------------------------------

      - name: Check API project structure
        run: |
          echo "Checking WSO2 API project..."
          
          if [ ! -f "api.yaml" ]; then
            echo "ERROR: api.yaml not found"
            exit 1
          fi
          
          if [ ! -f "api_meta.yaml" ]; then
            echo "ERROR: api_meta.yaml not found"
            exit 1
          fi
          
          if [ ! -f "Definitions/swagger.yaml" ]; then
            echo "ERROR: Definitions/swagger.yaml not found"
            exit 1
          fi
          
          if [ ! -f "redocly.yaml" ]; then
            echo "ERROR: redocly.yaml not found"
            exit 1
          fi
          
          echo "WSO2 API project structure is valid."
      

      # ----------------------------------------------------------
      # Validate OpenAPI specification
      # ----------------------------------------------------------

      - name: Validate OpenAPI specification
        run: |
          echo "Validating OpenAPI specification..."
          
          npx @redocly/cli lint Definitions/swagger.yaml \
            --config redocly.yaml
          
          echo "OpenAPI validation completed successfully."
  

  # ============================================================
  # 2. DEPLOY TO DEV
  # ============================================================

  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest

    needs: validate

    environment:
      name: dev

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_type == 'Rollback' && inputs.rollback_ref || github.ref }}


      # ----------------------------------------------------------
      # Show deployment type
      # ----------------------------------------------------------

      - name: Show deployment type
        run: |
          echo "=========================================="
          
          if [ "${{ inputs.deployment_type }}" = "Rollback" ]; then
            echo "ROLLBACK DEPLOYMENT"
            echo "Version: ${{ inputs.rollback_ref }}"
          else
            echo "NORMAL DEPLOYMENT"
          fi
          
          echo "=========================================="
      

      # ----------------------------------------------------------
      # Download WSO2 apictl
      # ----------------------------------------------------------

      - name: Download and extract apictl
        run: |
          echo "Downloading WSO2 apictl..."
          
          mkdir -p /tmp/apictl
          
          curl -L \
            -o /tmp/apictl.tar.gz \
            https://github.com/wso2/product-apim-tooling/releases/download/v4.7.2/apictl-4.7.2-linux-amd64.tar.gz
          
          tar -xzf /tmp/apictl.tar.gz -C /tmp/apictl
      

      # ----------------------------------------------------------
      # Add apictl to PATH
      # ----------------------------------------------------------

      - name: Add apictl to PATH
        run: |
          echo "/tmp/apictl/apictl" >> $GITHUB_PATH
      

      # ----------------------------------------------------------
      # Check apictl
      # ----------------------------------------------------------

      - name: Check apictl version
        run: |
          apictl version
      

      # ----------------------------------------------------------
      # Configure DEV WSO2 environment
      # ----------------------------------------------------------

      - name: Configure WSO2 DEV environment
        run: |
          echo "Configuring DEV WSO2 environment..."
          
          apictl add env target \
            --apim "${{ secrets.WSO2_APIM_URL }}"
      

      # ----------------------------------------------------------
      # Login to DEV
      # ----------------------------------------------------------

      - name: Login to WSO2 DEV
        run: |
          apictl login target \
            -u "${{ secrets.WSO2_USERNAME }}" \
            -p "${{ secrets.WSO2_PASSWORD }}" \
            -k
      

      # ----------------------------------------------------------
      # Deploy API to DEV
      # ----------------------------------------------------------

      - name: Deploy API to DEV
        run: |
          echo "Deploying API to DEV..."
          
          apictl import api \
            -f . \
            -e target \
            -k \
            --update \
            --verbose
          
          echo "DEV deployment completed successfully."
  

  # ============================================================
  # 3. DEPLOY TO PROD
  # ============================================================
  #
  # This job depends on DEV succeeding.
  #
  # The "prod" GitHub Environment must have:
  #
  #   Required reviewers
  #
  # configured.
  #
  # GitHub will automatically PAUSE this job and wait for
  # the assigned approver.
  #
  # ============================================================

  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest

    needs: deploy-dev

    environment:
      name: prod

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_type == 'Rollback' && inputs.rollback_ref || github.ref }}


      # ----------------------------------------------------------
      # Show deployment type
      # ----------------------------------------------------------

      - name: Show deployment type
        run: |
          echo "=========================================="
          
          if [ "${{ inputs.deployment_type }}" = "Rollback" ]; then
            echo "ROLLBACK TO PROD"
            echo "Version: ${{ inputs.rollback_ref }}"
          else
            echo "NORMAL DEPLOYMENT TO PROD"
          fi
          
          echo "=========================================="
      

      # ----------------------------------------------------------
      # Download WSO2 apictl
      # ----------------------------------------------------------

      - name: Download and extract apictl
        run: |
          echo "Downloading WSO2 apictl..."
          
          mkdir -p /tmp/apictl
          
          curl -L \
            -o /tmp/apictl.tar.gz \
            https://github.com/wso2/product-apim-tooling/releases/download/v4.7.2/apictl-4.7.2-linux-amd64.tar.gz
          
          tar -xzf /tmp/apictl.tar.gz -C /tmp/apictl
      

      # ----------------------------------------------------------
      # Add apictl to PATH
      # ----------------------------------------------------------

      - name: Add apictl to PATH
        run: |
          echo "/tmp/apictl/apictl" >> $GITHUB_PATH
      

      # ----------------------------------------------------------
      # Check apictl
      # ----------------------------------------------------------

      - name: Check apictl version
        run: |
          apictl version
      

      # ----------------------------------------------------------
      # Configure PROD WSO2 environment
      # ----------------------------------------------------------

      - name: Configure WSO2 PROD environment
        run: |
          echo "Configuring WSO2 PROD environment..."
          
          apictl add env target \
            --apim "${{ secrets.WSO2_APIM_URL }}"
      

      # ----------------------------------------------------------
      # Login to PROD
      # ----------------------------------------------------------

      - name: Login to WSO2 PROD
        run: |
          apictl login target \
            -u "${{ secrets.WSO2_USERNAME }}" \
            -p "${{ secrets.WSO2_PASSWORD }}" \
            -k
      

      # ----------------------------------------------------------
      # Deploy API to PROD
      # ----------------------------------------------------------

      - name: Deploy API to PROD
        run: |
          echo "Deploying API to PROD..."
          
          apictl import api \
            -f . \
            -e target \
            -k \
            --update \
            --verbose
          
          echo "PROD deployment completed successfully."
